---
ID01:
    enabled: true
    exclusions:
        messages: []
        files: []
ID02:
    enabled: true
    min_length: 7
VC:
    disabled: true
# Disable: # TE01: single quote instead of apostrophe for genitive (foo's)
TE01:
    enabled: false
# TE03: single quotes ('foo')
TE03:
    enabled: false
# TE04: Double-quoted strings should use Unicode " instead of "foo".
TE04:
    enabled: false
# Disable: TE05: 3 dots for ellipsis ("...")
TE05:
    enabled: false
# Should be fixed
VC01:
    disabled: true
ID03:
  enabled: true
# SY07: select variant keys must be CLDR plural categories or numbers.
# Plural selects match the category name, which is always an English
# identifier: a translated key such as [uno] or *[outros] never matches and
# silently renders the default variant.
# Exclude the few string selects, whose keys are values passed by the code.
SY07:
    enabled: true
    exclusions:
        messages:
            # $file_type is "directory" or another file type, not a number
            - cp-warning-source-specified-more-than-once
        files: []
