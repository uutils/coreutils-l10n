name: Weblate Synchronization

on:
  # Run every 6 hours to sync with Weblate
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual triggering
  workflow_dispatch:

  # Trigger on push to main branch (for source updates)
  push:
    branches: [ main ]
    paths:
      - 'src/uu/*/locales/en-US.ftl'
      - 'src/uucore/locales/en-US.ftl'
      - 'src/uu/*/src/*.rs'

# Serialize with upstream-source-sync: both push to main, and a source push
# landing mid-sync is what leaves Weblate behind and gets its push rejected.
concurrency:
  group: l10n-sync
  cancel-in-progress: false

jobs:
  sync-weblate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.WEBLATE_TOKEN || github.token }}
        fetch-depth: 0

    - name: Install Weblate CLI
      run: |
        pip install wlc

    - name: Configure Weblate CLI
      run: |
        mkdir -p ~/.config
        cat > ~/.config/weblate << EOF
        [weblate]
        url = https://hosted.weblate.org/api/

        [keys]
        https://hosted.weblate.org/api/ = ${{ secrets.WEBLATE_API_KEY }}
        EOF

    - name: Install Mozilla Fluent Linter
      run: |
        pip install moz-fluent-linter

    - name: Pull translations from Weblate
      run: |
        # `wlc pull` makes Weblate rebase its component repositories onto this
        # repo's main branch. hosted.weblate.org tends to drop the connection
        # (RemoteDisconnected, 502) or answer 423 while another operation holds
        # the repository lock, so retry a few times. Retrying does not help a
        # real rebase conflict; that one fails every attempt.
        #
        # Do not fall back to `wlc reset`. It discards Weblate's local commits
        # and pending changes and re-reads the translations from the files, so
        # every translation that Weblate has not pushed yet is lost (this
        # happened on 2026-08-25). If the rebase keeps failing, fail the job
        # and fix the merge in Weblate by hand; "Reset and reapply
        # translations" in the repository maintenance page keeps them.
        pull_translations() {
          local attempt
          for attempt in 1 2 3 4 5; do
            if wlc pull rust-coreutils; then
              return 0
            fi
            echo "::warning::wlc pull failed (attempt ${attempt})"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::wlc pull still failing after ${attempt} attempts; resolve the merge in Weblate without discarding translations"
          return 1
        }
        pull_translations

    - name: Keep "Push on commit" enabled on every component
      env:
        WEBLATE_API_KEY: ${{ secrets.WEBLATE_API_KEY }}
      run: |
        # Without it Weblate commits translations but never pushes them here
        # (85 components were silently stuck from 2026-09-17, see #71).
        api=https://hosted.weblate.org/api
        auth="Authorization: Token ${WEBLATE_API_KEY}"
        for slug in $(curl -sf -H "$auth" "$api/projects/rust-coreutils/components/?page_size=500" \
            | jq -r '.results[] | select(.push_on_commit | not) | .slug'); do
          echo "::warning::push_on_commit was off for ${slug}, enabling it"
          curl -sf -X PATCH -H "$auth" -H 'Content-Type: application/json' \
            -d '{"push_on_commit": true}' "$api/components/rust-coreutils/${slug}/" > /dev/null
        done

    - name: Push pending Weblate commits
      run: |
        # `wlc pull` above only updates Weblate from this repo; it never sends
        # Weblate's commits here. Push explicitly so nothing piles up on
        # Weblate's side, where a reset or failed rebase could lose it.
        wlc commit rust-coreutils
        for attempt in 1 2 3 4 5; do
          if wlc push rust-coreutils; then
            exit 0
          fi
          echo "::warning::wlc push failed (attempt ${attempt})"
          [ "$attempt" -lt 5 ] && sleep $((attempt * 30))
        done
        echo "::error::Weblate could not push its commits to GitHub; check the repository maintenance page"
        exit 1

    - name: Fix Fluent syntax issues
      run: |
        # Ensure all .ftl files end with a newline
        find src/uu/*/locales src/uucore/locales -name "*.ftl" -type f | while read -r f; do
          if [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ]; then
            echo "" >> "$f"
            echo "Fixed missing newline: $f"
          fi
        done

    - name: Validate Fluent syntax
      run: |
        has_errors=false
        for dir in $(find src/uu/*/locales src/uucore/locales -name "*.ftl" -type f -exec dirname {} \; | sort -u); do
          if ! moz-fluent-lint --config .github/fluent_linter_config.yml "$dir"; then
            echo "::warning::Fluent syntax issues in $dir"
            has_errors=true
          fi
        done
        if [ "$has_errors" = true ]; then
          echo "::warning::Some Fluent files have syntax issues that could not be auto-fixed"
        fi

    - name: Commit and push translations
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        if [ -n "$(git status --porcelain)" ]; then
          # Use find -type f so we don't traverse symlinked locales dirs
          # (e.g. base64/locales -> ../base32/locales), which would cause
          # "pathspec is beyond a symbolic link" errors from git add.
          find src/uu/*/locales src/uucore/locales -name '*.ftl' -type f -print0 \
            | xargs -0 git add --
          git commit -m "Update translations from Weblate"
          git pull --rebase
          git push
        else
          echo "No translation updates to commit"
        fi

    - name: Push source changes to Weblate
      id: push-sources
      if: github.event_name == 'push'
      run: |
        # Lock translations to prevent conflicts
        wlc lock rust-coreutils

        # Push source changes
        wlc push rust-coreutils

    - name: Unlock Weblate project
      # Always runs: a project left locked by a failed push blocks every
      # translator until someone unlocks it by hand.
      if: always() && steps.push-sources.outcome != 'skipped'
      run: |
        wlc unlock rust-coreutils
