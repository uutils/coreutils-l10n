name: Weblate Synchronization

on:
  # Run every 6 hours to sync with Weblate
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual triggering
  workflow_dispatch:

  # Trigger on push to main branch (for source updates)
  push:
    branches: [ main ]
    paths:
      - 'src/uu/*/locales/en-US.ftl'
      - 'src/uucore/locales/en-US.ftl'
      - 'src/uu/*/src/*.rs'

# Serialize with upstream-source-sync: both push to main, and a source push
# landing mid-sync is what leaves Weblate behind and gets its push rejected.
concurrency:
  group: l10n-sync
  cancel-in-progress: false

jobs:
  sync-weblate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.WEBLATE_TOKEN || github.token }}
        fetch-depth: 0

    - name: Install Weblate CLI
      run: |
        pip install wlc

    - name: Configure Weblate CLI
      run: |
        mkdir -p ~/.config
        cat > ~/.config/weblate << EOF
        [weblate]
        url = https://hosted.weblate.org/api/

        [keys]
        https://hosted.weblate.org/api/ = ${{ secrets.WEBLATE_API_KEY }}
        EOF

    - name: Install Mozilla Fluent Linter
      run: |
        pip install moz-fluent-linter

    - name: Keep "Push on commit" enabled on every component
      env:
        WEBLATE_API_KEY: ${{ secrets.WEBLATE_API_KEY }}
      run: |
        # Without it Weblate commits translations but never pushes them here
        # (85 components were silently stuck from 2026-09-17, see #71).
        api=https://hosted.weblate.org/api
        auth="Authorization: Token ${WEBLATE_API_KEY}"
        # Separate assignments: a failure inside `for x in $(...)` is ignored,
        # and would silently leave the setting off.
        components=$(curl -sf -H "$auth" "$api/projects/rust-coreutils/components/?page_size=500")
        if [ "$(jq -r '.next' <<< "$components")" != null ]; then
          echo "::error::component list is paginated, only the first page was checked"
          exit 1
        fi
        disabled=$(jq -r '.results[] | select(.push_on_commit | not) | .slug' <<< "$components")
        for slug in $disabled; do
          # Changing settings needs project admin rights on the API key; a
          # missing right must not stop the sync below.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H "$auth" \
            -H 'Content-Type: application/json' -d '{"push_on_commit": true}' \
            "$api/components/rust-coreutils/${slug}/")
          if [ "$code" = 200 ]; then
            echo "::warning::push_on_commit was off for ${slug}, enabled it"
          else
            echo "::warning::push_on_commit is off for ${slug} and enabling it failed (HTTP ${code})"
          fi
        done
        # Components backed by this Git repository (the glossary is local).
        jq -r '.results[] | select(.repo | startswith("local:") | not) | .slug' \
          <<< "$components" > "$RUNNER_TEMP/components"

    - name: Sync each component with Weblate
      run: |
        # Every component is its own clone of this repo. Project-wide
        # `wlc pull`/`wlc push` need all of their locks at once and keep
        # getting 423 Locked, and clones pushing independently reject each
        # other as non-fast-forward. So go one component at a time: rebase
        # its clone onto main (`wlc pull`), commit pending strings, push.
        #
        # Do not fall back to `wlc reset`. It discards Weblate's local commits
        # and pending changes and re-reads the translations from the files, so
        # every translation that Weblate has not pushed yet is lost (this
        # happened on 2026-08-25). If a rebase keeps failing, fix the merge in
        # Weblate by hand; "Reset and reapply translations" in the repository
        # maintenance page keeps them.
        retry() {
          local attempt
          for attempt in 1 2 3 4 5; do
            if "$@"; then
              return 0
            fi
            echo "::warning::$* failed (attempt ${attempt})"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done
          return 1
        }
        mapfile -t slugs < "$RUNNER_TEMP/components"
        failed=()
        for slug in "${slugs[@]}"; do
          component="rust-coreutils/${slug}"
          if ! retry wlc pull "$component" \
              || ! retry wlc commit "$component" \
              || ! retry wlc push "$component"; then
            failed+=("$slug")
          fi
        done
        # The pushes update GitHub, not this checkout: fast-forward so the
        # newline fix and Fluent validation below see the new files.
        git pull --ff-only
        if [ "${#failed[@]}" -gt 0 ]; then
          echo "::error::could not sync ${failed[*]}; check their repository maintenance page in Weblate without discarding translations"
          exit 1
        fi

    - name: Fix Fluent syntax issues
      run: |
        # Ensure all .ftl files end with a newline
        find src/uu/*/locales src/uucore/locales -name "*.ftl" -type f | while read -r f; do
          if [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ]; then
            echo "" >> "$f"
            echo "Fixed missing newline: $f"
          fi
        done

    - name: Validate Fluent syntax
      run: |
        has_errors=false
        for dir in $(find src/uu/*/locales src/uucore/locales -name "*.ftl" -type f -exec dirname {} \; | sort -u); do
          if ! moz-fluent-lint --config .github/fluent_linter_config.yml "$dir"; then
            echo "::warning::Fluent syntax issues in $dir"
            has_errors=true
          fi
        done
        if [ "$has_errors" = true ]; then
          echo "::warning::Some Fluent files have syntax issues that could not be auto-fixed"
        fi

    - name: Commit and push translations
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        if [ -n "$(git status --porcelain)" ]; then
          # Use find -type f so we don't traverse symlinked locales dirs
          # (e.g. base64/locales -> ../base32/locales), which would cause
          # "pathspec is beyond a symbolic link" errors from git add.
          find src/uu/*/locales src/uucore/locales -name '*.ftl' -type f -print0 \
            | xargs -0 git add --
          git commit -m "Update translations from Weblate"
          git pull --rebase
          git push
        else
          echo "No translation updates to commit"
        fi

    - name: Push source changes to Weblate
      id: push-sources
      if: github.event_name == 'push'
      run: |
        # Lock translations to prevent conflicts
        wlc lock rust-coreutils

        # Push source changes
        wlc push rust-coreutils

    - name: Unlock Weblate project
      # Always runs: a project left locked by a failed push blocks every
      # translator until someone unlocks it by hand.
      if: always() && steps.push-sources.outcome != 'skipped'
      run: |
        wlc unlock rust-coreutils
